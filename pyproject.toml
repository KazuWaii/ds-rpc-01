[project]
name = "ds-rpc-01"
version = "0.1.0"
description = "Starter project for the RPC-01: Internal Chatbot with Role Based Access Control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.115.12",
    "groq>=1.7.0",
    "ollama>=0.6.2",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
]

# We only ever run the embedding model on CPU (no GPU in this project or
# in a typical Azure App Service container), but torch's default PyPI
# wheel on Linux drags in several GB of NVIDIA CUDA packages it never
# uses. Pointing it at PyTorch's CPU-only index avoids that entirely.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
